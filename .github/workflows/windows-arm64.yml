name: Windows ARM64
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-arm64:
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@1d2148460059966a378ce2739cc4cbd25e307fd2
    with:
      app-name: pdfcraft
      app-dir: PdfCraft
      install-relative-path: Programs/ArtCraft/PdfCraft
      install-scope: perUser
