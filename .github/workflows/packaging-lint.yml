name: PDF font embedding test prerequisite Windows validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-font-test-import-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fonts:
    if: github.repository == 'FredApps/pdfcraft' && github.ref == 'refs/heads/diag/778-font-test-import-521cb6a0'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@ecb64b2acb8731f0e2eb8f55fd2f45424bef75d0
    with:
      os: '["windows-latest"]'
      select-os: '[]'
      timeout-minutes: 20
      gate-timeout-minutes: 18
      tools: ''
      targets: ''
      craft-fonts-ref: ''
      require-craft-fonts: false
      cache-name: pdf-font-test-import-scoped
      command: |
        git fetch --no-tags origin 521cb6a0f92a6ebb9de68cf6bb74c942ef16d039
        git diff --exit-code 521cb6a0f92a6ebb9de68cf6bb74c942ef16d039 HEAD -- . ':(exclude).github/workflows/packaging-lint.yml'
        echo 'Scoped PDF fonts tests/doctests and all-target lint only, not whole-workspace certification. Small pure-Rust package closure; runtime is unmeasured with a hard 20-minute job cap.'
        cargo fmt -p pdfcraft-fonts -- --check
        cargo test --locked -p pdfcraft-fonts
        cargo clippy --locked -p pdfcraft-fonts --all-targets -- -D warnings
        git diff --exit-code -- Cargo.lock
