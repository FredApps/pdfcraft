name: PDF JPEG metadata repair integrated validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-jpeg-metadata-${{ github.ref }}
  cancel-in-progress: false
jobs:
  create:
    if: github.repository == 'FredApps/pdfcraft' && github.ref == 'refs/heads/diag/778-jpeg-metadata-89174592'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@ecb64b2acb8731f0e2eb8f55fd2f45424bef75d0
    with:
      os: '["ubuntu-24.04", "windows-latest"]'
      select-os: '[]'
      timeout-minutes: 20
      gate-timeout-minutes: 18
      tools: ''
      targets: ''
      craft-fonts-ref: ''
      require-craft-fonts: false
      cache-name: pdf-font-test-import-scoped
      command: |
        git fetch --no-tags origin 7ef00ad847e5af108ef0a592903a236f2754c76b
        git diff --exit-code 7ef00ad847e5af108ef0a592903a236f2754c76b HEAD -- . ':(exclude).github/workflows/packaging-lint.yml'
        echo 'Scoped integrated PDF create tests/doctests and all-target lint, not whole-workspace certification. Source combines PR89174592 and merged test-import prerequisite6de83353. Runtime estimated under20 minutes from prior package and workspace builds but not measured for this closure. Optional external font store absent; bundled assets retained.'
        cargo fmt -p pdfcraft-create -- --check
        cargo test --locked -p pdfcraft-create
        cargo clippy --locked -p pdfcraft-create --all-targets -- -D warnings
        git diff --exit-code -- Cargo.lock
