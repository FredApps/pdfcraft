name: CI
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  git-sources:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    name: Git dependencies come from storytold
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Windows font notice regressions
      shell: pwsh
      run: ./packaging/windows/test-font-notices.ps1
    - name: Git dependencies come from storytold
      run: "set -euo pipefail\ntest -f Cargo.lock || { echo \"Cargo.lock is missing\"; exit 1; }\n# Source replacement, patches and path overrides in cargo config never show up\n# in Cargo.lock. Parsed rather than grepped: TOML has many spellings of one key.\n# Cargo still reads the legacy .cargo/config.\npython3 - <<'PY'\nimport os, sys, tomllib\nfor path in (\".cargo/config\", \".cargo/config.toml\"):\n    if not os.path.exists(path):\n        continue\n    config = tomllib.load(open(path, \"rb\"))\n    replaced = [name for name, source in config.get(\"source\", {}).items()\n                if isinstance(source, dict) and \"replace-with\" in source]\n    if replaced or \"patch\" in config or \"paths\" in config:\n        print(f\"{path} replaces, patches or overrides a source\")\n        sys.exit(1)\nPY\n# Fails when Cargo.lock is out of date with the manifests.\ncargo metadata --locked --format-version 1 > /dev/null\npython3 - <<'PY'\nimport sys, tomllib\nlock = tomllib.load(open(\"Cargo.lock\"\
        , \"rb\"))\nbad = sorted({p[\"source\"] for p in lock.get(\"package\", [])\n              if p.get(\"source\", \"\").startswith(\"git+\")\n              and not p[\"source\"].startswith(\"git+https://github.com/storytold/\")})\nif bad:\n    print(\"Git dependencies outside github.com/storytold:\", *bad, sep=\"\\n\")\n    sys.exit(1)\nPY\n"
  gate:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@8bb4e5ab95443171104ad88113fe1ef9b0e5ce3f
    with:
      os: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-24.04","windows-latest"]' || '["ubuntu-24.04"]' }}
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      packages: libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev qpdf poppler-utils
      tools: cargo-nextest@0.9.150,cargo-deny@0.20.2
      linux-env: PDFCRAFT_ORACLES_REQUIRED=1
      windows-env: PDFCRAFT_REQUIRE_WINRES=1
      windows-command: 'cargo clippy --workspace --all-targets --locked -- -D warnings

        cargo test --workspace --locked

        '
